server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    # Весь HTTP отдаёт сам стенд: страницы подтверждений и журнала, /upload, /files, /health.
    # У nginx здесь три работы — пароль на стенд, потолок загрузки и правильная
    # буферизация для двух разных по характеру потоков.

    # Streamable HTTP держит долгий SSE-поток: с буферизацией ответы застревают.
    location /mcp {
        proxy_pass http://node${INSTANCE}:${MCP_PORT};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        # Вызов ждёт подтверждения человека (TK_APPROVE_TIMEOUT) или команду (TK_FOREGROUND_TIMEOUT).
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # Очередь подтверждений обновляется по SSE — буферизация её тоже ломает.
    location /approvals {
        proxy_pass http://node${INSTANCE}:${MCP_PORT};

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
    }

    # Файлы с машины человека приезжают сюда в рабочую область, а не параметром инструмента:
    # гнать мегабайты через контекст модели нельзя. Потолок — CLIENT_MAX_BODY_SIZE.
    location /upload {
        proxy_pass http://node${INSTANCE}:${MCP_PORT};

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /health {
        access_log off;
        auth_basic off;
        proxy_pass http://node${INSTANCE}:${MCP_PORT}/health;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # Скачивание файлов рабочей области: большой дамп отдаётся потоком, без буфера на диске nginx.
    location /files/ {
        proxy_pass http://node${INSTANCE}:${MCP_PORT};

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    600s;
    }

    # Журнал и всё остальное: страница /audit, API.
    location / {
        proxy_pass http://node${INSTANCE}:${MCP_PORT};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header Cache-Control "no-store, must-revalidate" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
