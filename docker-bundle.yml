version: 2
name: toolkit
output: dist

image: ghcr.io/cat-of-summer/toolchain---mcp-package:latest

variants: [cpu]

# База — полный образ node, не slim: тулчейны агента (php, ruby, расширения python)
# собираются здесь из исходников, а nginx достраивается пакетом.
base:
  cpu: node:22-bookworm

network:
  name: network
  external: false

port_range: [22000, 22999]

globals: [NETWORK, INSTANCE, TZ, TRAEFIK_ENTRYPOINT, ACME_EMAIL]

sources:
  - {type: catalog, path: .}

recipes:

  nginx:
    extends: nginx
    families: [debian]

    copy:
      - {src: services/nginx/configs, dest: /etc/nginx/configs, kind: config, optional: false}
    pre_init: []
    post_init: []

    # entrypoint.nginx.sh считает set_real_ip_from через `ip route`; на debian-базе
    # команды `ip` нет — в исходном образе nginx:alpine её давал busybox.
    +install: {debian: [iproute2]}
    +match: {service: [nginx]}

    # Имя контейнера внутри бандла не резолвится: сервисы делят network namespace.
    post_copy:
      - "sed -i 's|proxy_pass http://node[^:]*:|proxy_pass http://127.0.0.1:|g' /etc/nginx/configs/nginx.toolkit.conf"

    port:
      default: 80
      configure:
        type: nginx_conf
        file: /etc/nginx/configs/nginx.toolkit.conf

    +mount_kinds: {"/var/www/html": skip}

  node:
    priority: 70
    match:
      image: ["node", "node:*"]
      service: [node]
    families: [debian]

    # Тот же набор, что в services/node/Dockerfile.node: клиенты БД для db_dump, SSH и git
    # для агента, библиотеки для сборки тулчейнов (как в CI git_toolkit).
    install:
      debian: [
        ca-certificates, curl, gnupg, default-mysql-client,
        openssh-client, git, unzip, xz-utils, zip, rsync, jq,
        build-essential, autoconf, bison, re2c, pkg-config,
        libxml2-dev, libssl-dev, libicu-dev, libzip-dev, libonig-dev, libcurl4-openssl-dev,
        libpng-dev, libjpeg-dev, libfreetype-dev, libwebp-dev, libgmp-dev, libsodium-dev,
        libreadline-dev, libbz2-dev, libsqlite3-dev, libpq-dev, libgd-dev, libffi-dev, libyaml-dev, zlib1g-dev,
      ]
    run:
      debian:
        - "curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg"
        - "echo 'deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
        - "apt-get update && apt-get install -y --no-install-recommends postgresql-client-17 && rm -rf /var/lib/apt/lists/*"
        # php 5 и 7 не собираются с OpenSSL 3 — для них рядом OpenSSL 1.1 (см. src/local/mise.js).
        - "curl -fsSL https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz | tar xz -C /tmp && cd /tmp/openssl-1.1.1w && ./config --prefix=/opt/openssl-1.1 --openssldir=/opt/openssl-1.1/ssl shared zlib no-tests && make -j$(nproc) >/dev/null && make install_sw >/dev/null && mkdir -p /opt/openssl-1.1/ssl && ln -sfn /etc/ssl/certs /opt/openssl-1.1/ssl/certs && cd / && rm -rf /tmp/openssl-1.1.1w"
        - "arch=$(dpkg --print-architecture); case $arch in amd64) arch=x64 ;; esac; curl -fsSL -o /usr/local/bin/mise https://github.com/jdx/mise/releases/download/v2026.10.1/mise-v2026.10.1-linux-$arch && chmod +x /usr/local/bin/mise && mise --version"

    # entrypoint модуля ставит зависимости при старте контейнера; в образе они запечены.
    entrypoint: skip

    copy:
      - {src: data/package.json,      dest: /var/www/html/package.json,      kind: code, optional: false}
      - {src: data/package-lock.json, dest: /var/www/html/package-lock.json, kind: code, optional: false}
      - {src: data/src,               dest: /var/www/html/src,               kind: code, optional: false}
      - {src: data/bin,               dest: /var/www/html/bin,               kind: code, optional: false}

    post_copy:
      - "cd /var/www/html && npm ci --omit=dev"
      - "mkdir -p /var/www/html/workspace /var/www/html/tools /var/www/html/state /var/www/html/logs"
      - "chmod +x /var/www/html/bin/tk.mjs && ln -sf /var/www/html/bin/tk.mjs /usr/local/bin/tk"

    port:
      default: 8933
      configure: {type: env_var, var: MCP_PORT}

    supervisor:
      - name: toolkit
        command: npm run mcp:http
        directory: /var/www/html
        priority: 35
        stopsignal: TERM
        stopwaitsecs: 20
        scalable: false
        critical: true
        environment:
          MCP_PORT: "{port}"

    readiness:
      - type: http
        target: "http://127.0.0.1:{port}/health"
        timeout: 60

    mount_kinds:
      "/var/www/html": skip

env:
  TRAEFIK_ENABLE: value:true
  EXTERNAL_ACCESS: prefix

  # Язык описаний инструментов MCP: их читает модель, а не человек.
  TK_LANG: value:ru

  # Всё, что ставит mise, — в томе tools: версии, глобальный конфиг и кэш переживают docker pull.
  MISE_DATA_DIR: value:/var/www/html/tools
  MISE_CACHE_DIR: value:/var/www/html/tools/.cache
  MISE_GLOBAL_CONFIG_FILE: value:/var/www/html/tools/config.toml
  MISE_TRUSTED_CONFIG_PATHS: value:/var/www/html/workspace
  MISE_YES: value:1
  # Версия mise закреплена: проверка обновлений там, где mise.jdx.dev недоступен,
  # только тормозит каждый вызов на 5–25 с.
  MISE_DISABLE_UPDATE_WARNING: value:1
  PHP_EXTRA_CONFIGURE_OPTIONS: value:--with-sodium

# Состояние переживает docker pull: рабочая область, тулчейны, задачи и ключи хостов, журнал.
volumes:
  workspace: /var/www/html/workspace
  tools:     /var/www/html/tools
  state:     /var/www/html/state
  logs:      /var/www/html/logs

services:
  traefik: {mode: off}
  network: {mode: off}

  app_nginx: {recipe: nginx}
  app_node:  {recipe: node}
